{% extends "base.html" %}

{% block title %}房源列表 - 租房管理系统{% endblock %}

{% block content %}
<section class="py-8">
    <div class="container">
        <div class="card mb-6">
            <div class="card-body">
                <form id="filter-form">
                    <div class="search-basic grid grid-4 gap-4">
                        <div class="form-group mb-0">
                            <label class="form-label">关键词</label>
                            <input type="text" class="form-control" id="keyword" name="keyword" placeholder="搜索小区、地铁、商圈...">
                        </div>
                        
                        <div class="form-group mb-0">
                            <label class="form-label">城市</label>
                            <select class="form-control" id="city" name="city">
                                <option value="">全部城市</option>
                                <option value="北京">北京</option>
                                <option value="上海">上海</option>
                                <option value="广州">广州</option>
                                <option value="深圳">深圳</option>
                                <option value="杭州">杭州</option>
                                <option value="南京">南京</option>
                                <option value="成都">成都</option>
                                <option value="武汉">武汉</option>
                            </select>
                        </div>
                        
                        <div class="form-group mb-0">
                            <label class="form-label">价格范围</label>
                            <select class="form-control" id="price_range" name="price_range">
                                <option value="">不限</option>
                                <option value="0-2000">2000元以下</option>
                                <option value="2000-4000">2000-4000元</option>
                                <option value="4000-6000">4000-6000元</option>
                                <option value="6000-8000">6000-8000元</option>
                                <option value="8000-10000">8000-10000元</option>
                                <option value="10000-999999">10000元以上</option>
                            </select>
                        </div>
                        
                        <div class="form-group mb-0 flex items-end gap-2">
                            <button type="submit" class="btn btn-primary">搜索</button>
                            <button type="button" class="btn btn-secondary" id="advanced-search-btn">高级搜索</button>
                        </div>
                    </div>
                    
                    <div class="search-advanced grid grid-4 gap-4 mt-4" id="search-advanced">
                        <div class="form-group mb-0">
                            <label class="form-label">户型</label>
                            <select class="form-control" id="bedrooms" name="bedrooms">
                                <option value="">不限</option>
                                <option value="1">一居</option>
                                <option value="2">二居</option>
                                <option value="3">三居</option>
                                <option value="4">四居及以上</option>
                            </select>
                        </div>
                        
                        <div class="form-group mb-0">
                            <label class="form-label">房屋类型</label>
                            <select class="form-control" id="house_type" name="house_type">
                                <option value="">不限</option>
                                <option value="apartment">公寓</option>
                                <option value="house">住宅</option>
                                <option value="villa">别墅</option>
                                <option value="shop">商铺</option>
                                <option value="office">写字楼</option>
                            </select>
                        </div>
                        
                        <div class="form-group mb-0">
                            <label class="form-label">装修情况</label>
                            <select class="form-control" id="decoration" name="decoration">
                                <option value="">不限</option>
                                <option value="rough">毛坯</option>
                                <option value="simple">简装</option>
                                <option value="standard">中装</option>
                                <option value="fine">精装</option>
                                <option value="luxury">豪装</option>
                            </select>
                        </div>
                        
                        <div class="form-group mb-0">
                            <label class="form-label">排序方式</label>
                            <select class="form-control" id="sort" name="sort">
                                <option value="">默认排序</option>
                                <option value="price_asc">价格从低到高</option>
                                <option value="price_desc">价格从高到低</option>
                                <option value="area_asc">面积从小到大</option>
                                <option value="area_desc">面积从大到小</option>
                                <option value="views">浏览量最高</option>
                                <option value="newest">最新发布</option>
                            </select>
                        </div>
                        
                        <div class="form-group mb-0 flex items-end gap-2">
                            <button type="button" class="btn btn-secondary" id="reset-btn">重置</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="flex justify-between items-center mb-4">
            <p class="text-secondary">共 <span id="total-count">0</span> 套房源</p>
        </div>
        
        <div id="houses-list" class="grid grid-4">
        </div>
        
        <div id="pagination-container"></div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1;
const pageSize = 12;
let pagination = null;

document.addEventListener('DOMContentLoaded', () => {
    initPagination();
    loadHouses();
    
    const filterForm = document.getElementById('filter-form');
    const resetBtn = document.getElementById('reset-btn');
    const advancedSearchBtn = document.getElementById('advanced-search-btn');
    const searchAdvanced = document.getElementById('search-advanced');
    
    if (filterForm) {
        filterForm.addEventListener('submit', (e) => {
            e.preventDefault();
            currentPage = 1;
            loadHouses();
        });
    }
    
    if (resetBtn) {
        resetBtn.addEventListener('click', () => {
            filterForm.reset();
            currentPage = 1;
            loadHouses();
        });
    }
    
    if (advancedSearchBtn && searchAdvanced) {
        advancedSearchBtn.addEventListener('click', () => {
            if (searchAdvanced.classList.contains('show')) {
                searchAdvanced.classList.remove('show');
                advancedSearchBtn.textContent = '高级搜索';
            } else {
                searchAdvanced.classList.add('show');
                advancedSearchBtn.textContent = '收起高级搜索';
            }
        });
    }
});

function initPagination() {
    pagination = new Pagination('#pagination-container', {
        currentPage: currentPage,
        pageSize: pageSize,
        total: 0,
        onPageChange: (page) => {
            currentPage = page;
            loadHouses();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    });
}

function getFilterParams() {
    const params = {
        page: currentPage,
        page_size: pageSize
    };
    
    const keyword = document.getElementById('keyword')?.value;
    const city = document.getElementById('city')?.value;
    const priceRange = document.getElementById('price_range')?.value;
    const bedrooms = document.getElementById('bedrooms')?.value;
    const houseType = document.getElementById('house_type')?.value;
    const decoration = document.getElementById('decoration')?.value;
    const sort = document.getElementById('sort')?.value;
    
    if (keyword) params.keyword = keyword;
    if (city) params.city = city;
    
    if (priceRange) {
        const [minPrice, maxPrice] = priceRange.split('-').map(Number);
        if (minPrice) params.min_price = minPrice;
        if (maxPrice) params.max_price = maxPrice;
    }
    
    if (bedrooms) {
        const b = parseInt(bedrooms);
        if (b >= 4) {
            params.min_bedrooms = 4;
        } else {
            params.bedrooms = b;
        }
    }
    
    if (houseType) params.house_type = houseType;
    if (decoration) params.decoration = decoration;
    if (sort) params.sort = sort;
    
    return params;
}

async function loadHouses() {
    const container = document.getElementById('houses-list');
    if (!container) return;
    
    const params = getFilterParams();
    
    try {
        const data = await http.get('/api/houses', params);
        
        const totalCount = document.getElementById('total-count');
        if (totalCount) {
            totalCount.textContent = data.total || 0;
        }
        
        if (pagination) {
            pagination.update({
                currentPage: data.page || currentPage,
                total: data.total || 0
            });
        }
        
        if (data.items && data.items.length > 0) {
            container.innerHTML = data.items.map(house => HouseUtils.renderHouseCard(house)).join('');
            FavoriteManager.bindFavoriteButtons(container);
        } else {
            container.innerHTML = `
                <div class="text-center py-8">
                    <p class="text-secondary">暂无符合条件的房源</p>
                </div>
            `;
        }
    } catch (error) {
        console.error('加载房源失败:', error);
        container.innerHTML = `
            <div class="text-center py-8">
                <p class="text-secondary">加载失败，请稍后重试</p>
            </div>
        `;
    }
}
</script>
{% endblock %}
