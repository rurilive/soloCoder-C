    }

    async function applySolidBackground() {
        const colorInput = document.getElementById('background-color');
        const color = colorInput.value;
        
        if (!color) {
            showToast('请选择颜色', 'error');
            return;
        }
        
        const currentSlide = pptData.slides[currentSlideIndex];
        
        try {
            const response = await fetch(`/api/documents/${currentDocId}/ppt/background/solid`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    slide_idx: currentSlide.slide_idx,
                    color: color
                })
            });
            
            if (response.ok) {
                showToast('纯色背景设置成功', 'success');
                closeBackgroundSettingsModal();
                await loadPptData();
                renderPptContent();
            } else {
                const error = await response.json();
                showToast(error.detail || '设置失败', 'error');
            }
        } catch (error) {
            showToast('网络错误', 'error');
        }
    }

    async function applyPictureBackground() {
        const imageInput = document.getElementById('background-image');
        const file = imageInput.files[0];
        
        if (!file) {
            showToast('请选择图片文件', 'error');
            return;
        }
        
        const currentSlide = pptData.slides[currentSlideIndex];
        
        const formData = new FormData();
        formData.append('slide_idx', currentSlide.slide_idx);
        formData.append('file', file);
        
        try {
            const response = await fetch(`/api/documents/${currentDocId}/ppt/background/picture`, {
                method: 'POST',
                body: formData
            });
            
            if (response.ok) {
                showToast('图片背景设置成功', 'success');
                closeBackgroundSettingsModal();
                await loadPptData();
                renderPptContent();
            } else {
                const error = await response.json();
                showToast(error.detail || '设置失败', 'error');
            }
        } catch (error) {
            showToast('网络错误', 'error');
        }
    }

    async function removeSlideBackground() {
        if (!confirm('确定要移除当前幻灯片的背景吗？')) {
            return;
        }
        
        const currentSlide = pptData.slides[currentSlideIndex];
        
        try {
            const response = await fetch(`/api/documents/${currentDocId}/ppt/background`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    slide_idx: currentSlide.slide_idx
                })
            });
            
            if (response.ok) {
                showToast('背景移除成功', 'success');
                closeBackgroundSettingsModal();
                await loadPptData();
                renderPptContent();
            } else {
                const error = await response.json();
                showToast(error.detail || '移除失败', 'error');
            }
        } catch (error) {
            showToast('网络错误', 'error');
        }
    }

    function showAddPictureModal() {
        if (!pptData || !pptData.slides || pptData.slides.length === 0) {
            showToast('请先选择幻灯片', 'error');
            return;
        }
        
        const currentSlide = pptData.slides[currentSlideIndex];
        
        const modalHtml = `
            <div id="add-picture-modal-overlay" class="modal-overlay" onclick="closeAddPictureModal(event)">
                <div class="modal" onclick="event.stopPropagation()">
                    <div class="modal-header">
                        <h3>添加图片 - 幻灯片 ${currentSlide.slide_idx}</h3>
                        <button class="modal-close" onclick="closeAddPictureModal()">×</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="picture-file">选择图片文件</label>
                            <input type="file" id="picture-file" accept="image/*" class="form-input">
                            <small class="form-hint">支持 JPG、PNG、GIF、WebP 格式</small>
                        </div>
                        
                        <div id="picture-preview" class="image-preview" style="display: none;">
                            <img id="picture-preview-img" style="max-width: 100%; max-height: 200px;">
                        </div>
                        
                        <div class="form-group">
                            <label>位置设置 (可选，单位：磅)</label>
                            <div class="form-row" style="display: flex; gap: 15px; flex-wrap: wrap;">
                                <div class="form-group" style="flex: 1; min-width: 120px;">
                                    <label for="picture-left">左边距</label>
                                    <input type="number" id="picture-left" value="0" class="form-input" min="0">
                                </div>
                                <div class="form-group" style="flex: 1; min-width: 120px;">
                                    <label for="picture-top">上边距</label>
                                    <input type="number" id="picture-top" value="0" class="form-input" min="0">
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>尺寸设置 (可选，单位：磅，留空则使用原始尺寸)</label>
                            <div class="form-row" style="display: flex; gap: 15px; flex-wrap: wrap;">
                                <div class="form-group" style="flex: 1; min-width: 120px;">
                                    <label for="picture-width">宽度</label>
                                    <input type="number" id="picture-width" class="form-input" min="1" placeholder="留空自动">
                                </div>
                                <div class="form-group" style="flex: 1; min-width: 120px;">
                                    <label for="picture-height">高度</label>
                                    <input type="number" id="picture-height" class="form-input" min="1" placeholder="留空自动">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeAddPictureModal()">取消</button>
                        <button type="button" class="btn btn-primary" id="add-picture-btn" onclick="submitAddPictureForm()" disabled>添加图片</button>
                    </div>
                </div>
            </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        
        const imageInput = document.getElementById('picture-file');
        const imagePreview = document.getElementById('picture-preview');
        const previewImg = document.getElementById('picture-preview-img');
        const addPictureBtn = document.getElementById('add-picture-btn');
        
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewImg.src = event.target.result;
                    imagePreview.style.display = 'block';
                    addPictureBtn.disabled = false;
                };
                reader.readAsDataURL(file);
            }
        });
    }

    function closeAddPictureModal(event) {
        if (!event || event.target === event.currentTarget) {
            const overlay = document.getElementById('add-picture-modal-overlay');
            if (overlay) {
                overlay.remove();
            }
        }
    }

    async function submitAddPictureForm() {
        const imageInput = document.getElementById('picture-file');
        const file = imageInput.files[0];
        
        if (!file) {
            showToast('请选择图片文件', 'error');
            return;
        }
        
        const currentSlide = pptData.slides[currentSlideIndex];
        const left = parseFloat(document.getElementById('picture-left').value) || 0;
        const top = parseFloat(document.getElementById('picture-top').value) || 0;
        const widthInput = document.getElementById('picture-width').value;
        const heightInput = document.getElementById('picture-height').value;
        
        const formData = new FormData();
        formData.append('slide_idx', currentSlide.slide_idx);
        formData.append('left', left);
        formData.append('top', top);
        if (widthInput) {
            formData.append('width', parseFloat(widthInput));
        }
        if (heightInput) {
            formData.append('height', parseFloat(heightInput));
        }
        formData.append('file', file);
        
        try {
            const response = await fetch(`/api/documents/${currentDocId}/ppt/picture`, {
                method: 'POST',
                body: formData
            });
            
            if (response.ok) {
                showToast('图片添加成功', 'success');
                closeAddPictureModal();
                await loadPptData();
                renderPptContent();
            } else {
                const error = await response.json();
                showToast(error.detail || '添加失败', 'error');
            }
        } catch (error) {
            showToast('网络错误', 'error');
        }
    }

    function formatDateTime(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        return date.toLocaleString('zh-CN');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function goBack() {
        if (document.referrer && document.referrer !== window.location.href) {
            window.history.back();
        } else {
            window.location.href = '/';
        }
    }

    async function deleteDocument() {
        if (!confirm('确定要删除此文档吗？')) {
            return;
        }

        try {
            const response = await fetch(`/api/documents/${currentDocId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showToast('文档删除成功', 'success');
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                const error = await response.json();
                showToast(error.detail || '删除失败', 'error');
            }
        } catch (error) {
            showToast('网络错误', 'error');
        }
    }

    function showMoveModal() {
        const modalHtml = `
            <div id="move-modal-overlay" class="modal-overlay" onclick="closeMoveModal(event)">
                <div class="modal" onclick="event.stopPropagation()">
                    <div class="modal-header">
                        <h3>移动文档</h3>
                        <button class="modal-close" onclick="closeMoveModal()">×</button>
                    </div>
                    <div class="modal-body">
                        <form id="move-form">
                            <div class="form-group">
                                <label for="target-folder">目标文件夹</label>
                                <select id="target-folder" class="form-select">
                                    <option value="0">根目录</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeMoveModal()">取消</button>
                        <button type="button" class="btn btn-primary" onclick="submitMoveForm()">确定</button>
                    </div>
                </div>
            </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        loadFoldersForMove();
    }

    async function loadFoldersForMove() {
        try {
            const response = await fetch('/api/folders/tree');
            const data = await response.json();
            const select = document.getElementById('target-folder');
            
            let optionsHtml = '<option value="0">根目录</option>';
            optionsHtml += renderFolderOptions(data.folders, 0);
            select.innerHTML = optionsHtml;
            
            if (currentDocument && currentDocument.folder_id) {
                select.value = currentDocument.folder_id;
            }
        } catch (error) {
            console.error('加载文件夹失败:', error);
        }
    }

    function renderFolderOptions(folders, level) {
        let html = '';
        const prefix = '　'.repeat(level);
        
        folders.forEach(folder => {
            html += `<option value="${folder.id}">${prefix}📁 ${folder.name}</option>`;
            if (folder.children && folder.children.length > 0) {
                html += renderFolderOptions(folder.children, level + 1);
            }
        });
        
        return html;
    }

    function closeMoveModal(event) {
        if (!event || event.target === event.currentTarget) {
            const overlay = document.getElementById('move-modal-overlay');
            if (overlay) {
                overlay.remove();
            }
        }
    }

    async function submitMoveForm() {
        const folderId = document.getElementById('target-folder').value;
        
        try {
            const response = await fetch(`/api/documents/${currentDocId}/move/${folderId}`, {
                method: 'PUT'
            });

            if (response.ok) {
                showToast('文档移动成功', 'success');
                closeMoveModal();
                loadFolderTree();
                loadDocument();
            } else {
                const error = await response.json();
                showToast(error.detail || '移动失败', 'error');
            }
        } catch (error) {
            showToast('网络错误', 'error');
        }
    }

    function showEditModal() {
        if (!currentDocument) {
            showToast('文档未加载完成，请稍后重试', 'error');
            return;
        }

        const modalHtml = `
            <div id="edit-modal-overlay" class="modal-overlay" onclick="closeEditModal(event)">
                <div class="modal modal-large" onclick="event.stopPropagation()">
                    <div class="modal-header">
                        <h3>编辑文档</h3>
                        <button class="modal-close" onclick="closeEditModal()">×</button>
                    </div>
                    <div class="modal-body">
                        <form id="edit-form">
                            <div class="form-group">
                                <label for="edit-title">文档标题</label>
                                <input type="text" id="edit-title" class="form-input" 
                                       value="${escapeHtml(currentDocument.title)}" placeholder="输入文档标题">
                            </div>
                            <div class="form-group">
                                <label for="edit-content">文档内容</label>
                                <textarea id="edit-content" class="form-textarea" 
                                          placeholder="输入文档内容...">${escapeHtml(currentDocument.content || '')}</textarea>
                            </div>
                            <div class="form-group">
                                <label for="edit-html-content">HTML内容 (可选)</label>
                                <textarea id="edit-html-content" class="form-textarea" 
                                          placeholder="输入HTML内容...">${escapeHtml(currentDocument.html_content || '')}</textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeEditModal()">取消</button>
                        <button type="button" class="btn btn-primary" onclick="submitEditForm()">保存</button>
                    </div>
                </div>
            </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function closeEditModal(event) {
        if (!event || event.target === event.currentTarget) {
            const overlay = document.getElementById('edit-modal-overlay');
            if (overlay) {
                overlay.remove();
            }
        }
    }

    async function submitEditForm() {
        const title = document.getElementById('edit-title').value.trim();
        const content = document.getElementById('edit-content').value;
        const htmlContent = document.getElementById('edit-html-content').value;
        
        if (!title) {
            showToast('请输入文档标题', 'error');
            return;
        }

        try {
            const response = await fetch(`/api/documents/${currentDocId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    title: title,
                    content: content,
                    html_content: htmlContent
                })
            });

            if (response.ok) {
                showToast('文档保存成功', 'success');
                closeEditModal();
                loadDocument();
            } else {
                const error = await response.json();
                showToast(error.detail || '保存失败', 'error');
            }
        } catch (error) {
            showToast('网络错误', 'error');
        }
    }

    async function reparseDocument() {
        if (!confirm('确定要重新解析此文档吗？这将使用最新的解析器重新提取文档内容。')) {
            return;
        }

        try {
            const reparseBtn = document.getElementById('reparse-btn');
            const originalText = reparseBtn.textContent;
            reparseBtn.textContent = '解析中...';
            reparseBtn.disabled = true;

            const response = await fetch(`/api/documents/${currentDocId}/reparse`, {
                method: 'POST'
            });

            if (response.ok) {
                showToast('文档重新解析成功', 'success');
                loadDocument();
            } else {
                const error = await response.json();
                showToast(error.detail || '重新解析失败', 'error');
            }

            reparseBtn.textContent = originalText;
            reparseBtn.disabled = false;
        } catch (error) {
            showToast('网络错误', 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadDocument();
    });
</script>
{% endblock %}
