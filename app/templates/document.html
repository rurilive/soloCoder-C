{% extends "base.html" %}

{% block title %}{{ doc_id }} - 文档详情{% endblock %}

{% block content %}
<div class="page-header">
    <button class="btn btn-secondary" onclick="goBack()">← 返回</button>
    <h2 id="document-title">加载中...</h2>
    <div class="document-actions-header">
        <button class="btn btn-primary" id="edit-btn" onclick="showEditModal()" disabled>✏️ 编辑文档</button>
        <button class="btn btn-secondary" id="reparse-btn" onclick="reparseDocument()" disabled>🔄 重新解析</button>
        <button class="btn btn-secondary" id="move-btn" onclick="showMoveModal()" disabled>移动文档</button>
        <button class="btn btn-danger" id="delete-btn" onclick="deleteDocument()" disabled>删除文档</button>
    </div>
</div>

<div class="content-section">
    <div id="document-meta" class="document-meta-info">
        加载中...
    </div>
    
    <div id="document-content" class="document-content">
        <div class="loading">加载中...</div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentDocId = {{ doc_id }};
    let currentDocument = null;
    let excelData = null;
    let excelMetadata = null;
    let currentSheetIndex = 0;
    let isExcelEditMode = false;
    
    let pptData = null;
    let pptMetadata = null;
    let currentSlideIndex = 0;
    let isPptEditMode = false;
    
    let paginationState = {
        currentPage: 1,
        rowsPerPage: 100,
        totalRows: 0,
        totalPages: 0,
        currentSheetName: null,
        isLoading: false,
    };

    async function loadDocument() {
        try {
            const response = await fetch(`/api/documents/${currentDocId}`);
            
            if (!response.ok) {
                throw new Error('文档不存在');
            }
            
            currentDocument = await response.json();
            
            document.getElementById('document-title').textContent = currentDocument.title;
            document.title = `${currentDocument.title} - 文档管理平台`;
            
            const metaInfo = document.getElementById('document-meta');
            metaInfo.innerHTML = `
                <div class="meta-row">
                    <span class="meta-label">文件名:</span>
                    <span class="meta-value">${currentDocument.filename}</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">文件类型:</span>
                    <span class="meta-value">${currentDocument.file_type.toUpperCase()}</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">创建时间:</span>
                    <span class="meta-value">${formatDateTime(currentDocument.created_at)}</span>
                </div>
                ${currentDocument.updated_at ? `
                <div class="meta-row">
                    <span class="meta-label">更新时间:</span>
                    <span class="meta-value">${formatDateTime(currentDocument.updated_at)}</span>
                </div>
                ` : ''}
            `;
            
            const contentDiv = document.getElementById('document-content');
            if (currentDocument.file_type === 'excel') {
                await loadExcelData();
                renderExcelContent();
            } else if (currentDocument.file_type === 'ppt') {
                await loadPptData();
                renderPptContent();
            } else if (currentDocument.html_content) {
                contentDiv.innerHTML = currentDocument.html_content;
            } else if (currentDocument.content) {
                contentDiv.innerHTML = `<pre>${escapeHtml(currentDocument.content)}</pre>`;
            } else {
                contentDiv.innerHTML = '<div class="empty-message">此文档暂无内容</div>';
            }
            
            document.getElementById('edit-btn').disabled = false;
            document.getElementById('reparse-btn').disabled = false;
            document.getElementById('move-btn').disabled = false;
            document.getElementById('delete-btn').disabled = false;
            
            if (currentDocument.file_type === 'excel') {
                addExcelEditButton();
            } else if (currentDocument.file_type === 'ppt') {
                addPptEditButton();
            }
        } catch (error) {
            console.error('加载文档失败:', error);
            document.getElementById('document-content').innerHTML = `
                <div class="error-state">
                    <div class="error-icon">❌</div>
                    <h3>加载失败</h3>
                    <p>${error.message}</p>
                    <button class="btn btn-primary" onclick="window.location.href='/'">返回首页</button>
                </div>
            `;
        }
    }

    function addExcelEditButton() {
        const headerActions = document.querySelector('.document-actions-header');
        if (headerActions && !document.getElementById('excel-edit-btn')) {
            const excelEditBtn = document.createElement('button');
            excelEditBtn.id = 'excel-edit-btn';
            excelEditBtn.className = 'btn btn-secondary';
            excelEditBtn.innerHTML = '📊 Excel编辑模式';
            excelEditBtn.onclick = toggleExcelEditMode;
            headerActions.insertBefore(excelEditBtn, headerActions.firstChild);
        }
    }

    function addPptEditButton() {
        const headerActions = document.querySelector('.document-actions-header');
        if (headerActions && !document.getElementById('ppt-edit-btn')) {
            const pptEditBtn = document.createElement('button');
            pptEditBtn.id = 'ppt-edit-btn';
            pptEditBtn.className = 'btn btn-secondary';
            pptEditBtn.innerHTML = '📽️ PPT编辑模式';
            pptEditBtn.onclick = togglePptEditMode;
            headerActions.insertBefore(pptEditBtn, headerActions.firstChild);
        }
    }

    async function loadExcelData() {
        try {
            const metadataResponse = await fetch(`/api/documents/${currentDocId}/excel/metadata`);
            if (metadataResponse.ok) {
                excelMetadata = await metadataResponse.json();
                
                if (excelMetadata.success && excelMetadata.sheets && excelMetadata.sheets.length > 0) {
                    const MAX_ROWS_FULL_LOAD = 1000;
                    const largestSheet = excelMetadata.sheets.reduce((max, sheet) => 
                        sheet.max_row > max.max_row ? sheet : max
                    );
                    
                    if (largestSheet.max_row <= MAX_ROWS_FULL_LOAD) {
                        const dataResponse = await fetch(`/api/documents/${currentDocId}/excel/data`);
                        if (dataResponse.ok) {
                            excelData = await dataResponse.json();
                            currentSheetIndex = 0;
                        }
                    } else {
                        excelData = {
                            success: true,
                            sheets: excelMetadata.sheets.map(sheet => ({
                                name: sheet.name,
                                max_row: sheet.max_row,
                                max_col: sheet.max_col,
                                data: [],
                                is_paginated: true,
                                message: `表格较大（${sheet.max_row}行），使用分页加载`,
                            })),
                            sheet_count: excelMetadata.sheets.length,
                            is_large_file: true,
                        };
                        currentSheetIndex = 0;
                        
                        if (excelMetadata.sheets.length > 0) {
                            const firstSheet = excelMetadata.sheets[0];
                            await loadPaginatedSheetData(firstSheet.name, 1);
                        }
                    }
                }
            }
        } catch (error) {
            console.error('加载Excel数据失败:', error);
        }
    }

    async function loadPptData() {
        try {
            const metadataResponse = await fetch(`/api/documents/${currentDocId}/ppt/metadata`);
            if (metadataResponse.ok) {
                pptMetadata = await metadataResponse.json();
                
                if (pptMetadata.success) {
                    const MAX_SLIDES_FULL_LOAD = 50;
                    
                    if (pptMetadata.slide_count <= MAX_SLIDES_FULL_LOAD) {
                        const dataResponse = await fetch(`/api/documents/${currentDocId}/ppt/data`);
                        if (dataResponse.ok) {
                            pptData = await dataResponse.json();
                            currentSlideIndex = 0;
                        }
                    } else {
                        pptData = {
                            success: true,
                            slides: pptMetadata.slides.map((slide, index) => ({
                                slide_idx: slide.slide_idx,
                                layout_name: slide.layout_name,
                                shape_count: slide.shape_count,
                                is_paginated: true,
                                shapes: [],
                            })),
                            slide_count: pptMetadata.slide_count,
                            slide_width: pptMetadata.slide_width,
                            slide_height: pptMetadata.slide_height,
                            is_large_file: true,
                        };
                        currentSlideIndex = 0;
                        
                        if (pptMetadata.slides && pptMetadata.slides.length > 0) {
                            await loadPaginatedSlideData(1);
                        }
                    }
                }
            }
        } catch (error) {
            console.error('加载PPT数据失败:', error);
        }
    }

    async function loadPaginatedSlideData(slideIdx) {
        try {
            const response = await fetch(
                `/api/documents/${currentDocId}/ppt/data/paginated?start_slide=${slideIdx}&end_slide=${slideIdx}&include_notes=true`
            );
            
            if (response.ok) {
                const data = await response.json();
                
                if (data.success && data.slides && data.slides.length > 0) {
                    if (pptData && pptData.slides) {
                        const slideIndex = pptData.slides.findIndex(s => s.slide_idx === slideIdx);
                        if (slideIndex !== -1) {
                            pptData.slides[slideIndex] = data.slides[0];
                            pptData.slides[slideIndex].is_paginated = false;
                        }
                    }
                }
            }
        } catch (error) {
            console.error('分页加载幻灯片数据失败:', error);
        }
    }

    async function loadPaginatedSheetData(sheetName, page) {
        if (paginationState.isLoading) return;
        
        paginationState.isLoading = true;
        showLoadingIndicator();
        
        try {
            const startRow = (page - 1) * paginationState.rowsPerPage + 1;
            const endRow = page * paginationState.rowsPerPage;
            
            const response = await fetch(
                `/api/documents/${currentDocId}/excel/data/paginated?sheet_name=${encodeURIComponent(sheetName)}&start_row=${startRow}&end_row=${endRow}&include_styles=false`
            );
            
            if (response.ok) {
                const data = await response.json();
                
                if (data.success) {
                    paginationState.currentPage = page;
                    paginationState.currentSheetName = sheetName;
                    paginationState.totalRows = data.total_rows;
                    paginationState.totalPages = Math.ceil(data.total_rows / paginationState.rowsPerPage);
                    
                    if (excelData && excelData.sheets) {
                        const sheetIndex = excelData.sheets.findIndex(s => s.name === sheetName);
                        if (sheetIndex !== -1) {
                            excelData.sheets[sheetIndex].data = data.data;
                            excelData.sheets[sheetIndex].merged_cells = data.merged_cells || [];
                            excelData.sheets[sheetIndex]._paginatedData = true;
                        }
                    }
                }
            }
        } catch (error) {
            console.error('分页加载数据失败:', error);
            showToast('加载数据失败', 'error');
        } finally {
            paginationState.isLoading = false;
            hideLoadingIndicator();
            renderExcelContent();
        }
    }

    function showLoadingIndicator() {
        let indicator = document.getElementById('excel-loading-indicator');
        if (!indicator) {
            indicator = document.createElement('div');
            indicator.id = 'excel-loading-indicator';
            indicator.className = 'excel-loading-indicator';
            indicator.innerHTML = `
                <div class="loading-spinner"></div>
                <span>加载中...</span>
            `;
            document.body.appendChild(indicator);
        }
        indicator.style.display = 'flex';
    }

    function hideLoadingIndicator() {
        const indicator = document.getElementById('excel-loading-indicator');
        if (indicator) {
            indicator.style.display = 'none';
        }
    }

    function renderExcelContent() {
        const contentDiv = document.getElementById('document-content');
        
        if (!excelData || !excelData.success || !excelData.sheets || excelData.sheets.length === 0) {
            if (currentDocument.html_content) {
                contentDiv.innerHTML = currentDocument.html_content;
            } else if (currentDocument.content) {
                contentDiv.innerHTML = `<pre>${escapeHtml(currentDocument.content)}</pre>`;
            }
            return;
        }
        
        let html = '';
        
        if (excelData.sheets.length > 1) {
            html += '<div class="sheet-tabs">';
            excelData.sheets.forEach((sheet, index) => {
                const activeClass = index === currentSheetIndex ? 'active' : '';
                const rowCount = sheet.max_row || 0;
                html += `<button class="sheet-tab ${activeClass}" onclick="switchSheet(${index})">
                    ${escapeHtml(sheet.name)}
                    <span class="sheet-row-count">${rowCount.toLocaleString()}行</span>
                </button>`;
            });
            html += '</div>';
        }
        
        const currentSheet = excelData.sheets[currentSheetIndex];
        
        const isPaginated = currentSheet.is_paginated || excelData.is_large_file;
        if (isPaginated) {
            html += renderPaginationInfo(currentSheet);
        }
        
        html += renderSheetTable(currentSheet);
        
        if (isPaginated && paginationState.totalPages > 1) {
            html += renderPaginationControls();
        }
        
        contentDiv.innerHTML = html;
    }

    function renderPaginationInfo(sheet) {
        const totalRows = paginationState.totalRows || sheet.max_row || 0;
        const currentPage = paginationState.currentPage;
        const rowsPerPage = paginationState.rowsPerPage;
        const totalPages = paginationState.totalPages || Math.ceil(totalRows / rowsPerPage);
        
        const startRow = (currentPage - 1) * rowsPerPage + 1;
        const endRow = Math.min(currentPage * rowsPerPage, totalRows);
        
        return `
            <div class="pagination-info">
                <div class="pagination-stats">
                    <span class="stat-item">
                        <strong>总行数:</strong> ${totalRows.toLocaleString()}
                    </span>
                    <span class="stat-item">
                        <strong>当前页:</strong> ${currentPage} / ${totalPages}
                    </span>
                    <span class="stat-item">
                        <strong>显示行:</strong> ${startRow.toLocaleString()} - ${endRow.toLocaleString()}
                    </span>
                </div>
                <div class="pagination-settings">
                    <label>每页显示:</label>
                    <select id="rows-per-page-select" onchange="changeRowsPerPage(this.value)">
                        <option value="50" ${rowsPerPage === 50 ? 'selected' : ''}>50行</option>
                        <option value="100" ${rowsPerPage === 100 ? 'selected' : ''}>100行</option>
                        <option value="200" ${rowsPerPage === 200 ? 'selected' : ''}>200行</option>
                        <option value="500" ${rowsPerPage === 500 ? 'selected' : ''}>500行</option>
                    </select>
                </div>
            </div>
        `;
    }

    function renderPaginationControls() {
        const currentPage = paginationState.currentPage;
        const totalPages = paginationState.totalPages;
        const sheetName = excelData.sheets[currentSheetIndex].name;
        
        let pages = [];
        const maxVisiblePages = 5;
        
        let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
        
        if (endPage - startPage + 1 < maxVisiblePages) {
            startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }
        
        for (let i = startPage; i <= endPage; i++) {
            pages.push(i);
        }
        
        let html = '<div class="pagination-controls">';
        
        html += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" 
            onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>
            ⏮️ 首页
        </button>`;
        
        html += `<button class="page-btn ${currentPage === 1 ? 'disabled' : ''}" 
            onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
            ◀ 上一页
        </button>`;
        
        if (startPage > 1) {
            html += '<span class="page-ellipsis">...</span>';
        }
        
        pages.forEach(page => {
            const activeClass = page === currentPage ? 'active' : '';
            html += `<button class="page-btn ${activeClass}" onclick="goToPage(${page})">${page}</button>`;
        });
        
        if (endPage < totalPages) {
            html += '<span class="page-ellipsis">...</span>';
        }
        
        html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" 
            onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
            下一页 ▶
        </button>`;
        
        html += `<button class="page-btn ${currentPage === totalPages ? 'disabled' : ''}" 
            onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>
            末页 ⏭️
        </button>`;
        
        html += `<div class="page-jump">
            <label>跳转到:</label>
            <input type="number" id="jump-page-input" min="1" max="${totalPages}" value="${currentPage}" 
                onkeydown="handleJumpPage(event, ${totalPages})">
            <button class="btn btn-small" onclick="handleJumpPageClick(${totalPages})">确定</button>
        </div>`;
        
        html += '</div>';
        
        return html;
    }

    function goToPage(page) {
        const sheetName = excelData.sheets[currentSheetIndex].name;
        loadPaginatedSheetData(sheetName, page);
    }

    function changeRowsPerPage(value) {
        paginationState.rowsPerPage = parseInt(value);
        paginationState.currentPage = 1;
        const sheetName = excelData.sheets[currentSheetIndex].name;
        loadPaginatedSheetData(sheetName, 1);
    }

    function handleJumpPage(event, totalPages) {
        if (event.key === 'Enter') {
            const input = document.getElementById('jump-page-input');
            const page = parseInt(input.value);
            if (page >= 1 && page <= totalPages) {
                goToPage(page);
            } else {
                showToast('请输入有效的页码', 'error');
            }
        }
    }

    function handleJumpPageClick(totalPages) {
        const input = document.getElementById('jump-page-input');
        const page = parseInt(input.value);
        if (page >= 1 && page <= totalPages) {
            goToPage(page);
        } else {
            showToast('请输入有效的页码', 'error');
        }
    }

    function renderSheetTable(sheet) {
        if (!sheet || !sheet.data || sheet.data.length === 0) {
            return '<div class="empty-message">此工作表暂无数据</div>';
        }
        
        let html = '<div class="excel-table-container">';
        html += '<table class="excel-table">';
        
        sheet.data.forEach((row, rowIdx) => {
            html += '<tr>';
            row.forEach((cell, colIdx) => {
                if (cell.is_merged && !cell.merge_master) {
                    return;
                }
                
                let cellAttrs = '';
                if (cell.merge_range) {
                    const [minRow, minCol, maxRow, maxCol] = cell.merge_range;
                    const rowspan = maxRow - minRow + 1;
                    const colspan = maxCol - minCol + 1;
                    if (rowspan > 1) cellAttrs += ` rowspan="${rowspan}"`;
                    if (colspan > 1) cellAttrs += ` colspan="${colspan}"`;
                }
                
                let cellStyle = '';
                if (cell.data_type) {
                    cellStyle += getDataTypeClass(cell.data_type);
                }
                
                const cellValue = cell.value !== null && cell.value !== undefined ? cell.value : '';
                const tag = rowIdx === 0 ? 'th' : 'td';
                
                const editAttrs = isExcelEditMode ? 
                    ` contenteditable="true" data-row="${cell.row}" data-col="${cell.col}" data-sheet="${sheet.name}" onblur="handleCellEdit(this)" onkeydown="handleCellKeydown(event, this)"` : '';
                
                html += `<${tag}${cellAttrs} class="${cellStyle}"${editAttrs}>${escapeHtml(String(cellValue))}</${tag}>`;
            });
            html += '</tr>';
        });
        
        html += '</table>';
        html += '</div>';
        
        if (isExcelEditMode) {
            html += `
                <div class="excel-edit-actions">
                    <button class="btn btn-primary" onclick="addNewSheet()">➕ 添加工作表</button>
                    <button class="btn btn-danger" onclick="confirmDeleteSheet()">🗑️ 删除当前工作表</button>
                    <button class="btn btn-secondary" onclick="toggleExcelEditMode()">✓ 退出编辑模式</button>
                </div>
            `;
        }
        
        return html;
    }

    function getDataTypeClass(dataType) {
        const typeMap = {
            'number': 'cell-number',
            'percentage': 'cell-percentage',
            'datetime': 'cell-datetime',
            'boolean': 'cell-boolean',
            'formula': 'cell-formula',
            'string': 'cell-string',
        };
        return typeMap[dataType] || '';
    }

    async function switchSheet(index) {
        currentSheetIndex = index;
        
        const targetSheet = excelData.sheets[index];
        const isPaginated = targetSheet.is_paginated || excelData.is_large_file;
        
        if (isPaginated) {
            paginationState.currentPage = 1;
            await loadPaginatedSheetData(targetSheet.name, 1);
        } else {
            renderExcelContent();
        }
    }

    function toggleExcelEditMode() {
        isExcelEditMode = !isExcelEditMode;
        const btn = document.getElementById('excel-edit-btn');
        if (btn) {
            btn.innerHTML = isExcelEditMode ? '✓ 退出Excel编辑' : '📊 Excel编辑模式';
            btn.className = isExcelEditMode ? 'btn btn-success' : 'btn btn-secondary';
        }
        renderExcelContent();
        
        if (isExcelEditMode) {
            showToast('已进入Excel编辑模式，点击单元格即可编辑', 'info');
        }
    }

    async function handleCellEdit(element) {
        const sheetName = element.dataset.sheet;
        const row = parseInt(element.dataset.row);
        const col = parseInt(element.dataset.col);
        const newValue = element.textContent;
        
        const cell = findCellInSheet(sheetName, row, col);
        if (cell && String(cell.value) === newValue) {
            return;
        }
        
        try {
            const response = await fetch(`/api/documents/${currentDocId}/excel/cell`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    sheet_name: sheetName,
                    row: row,
                    col: col,
                    value: parseCellValue(newValue)
                })
            });
            
            if (response.ok) {
                const result = await response.json();
                if (cell) {
                    cell.value = newValue;
                }
                showToast('单元格更新成功', 'success');
                
                if (result.document && result.document.html_content) {
                    currentDocument.html_content = result.document.html_content;
                    currentDocument.content = result.document.content;
                }
            } else {
                const error = await response.json();
                showToast(error.detail || '更新失败', 'error');
                if (cell) {
                    element.textContent = cell.value !== null ? cell.value : '';
                }
            }
        } catch (error) {
            showToast('网络错误', 'error');
            if (cell) {
                element.textContent = cell.value !== null ? cell.value : '';
            }
        }
    }

    function handleCellKeydown(event, element) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            element.blur();
        }
        if (event.key === 'Escape') {
            const cell = findCellInSheet(element.dataset.sheet, parseInt(element.dataset.row), parseInt(element.dataset.col));
            if (cell) {
                element.textContent = cell.value !== null ? cell.value : '';
            }
            element.blur();
        }
    }

    function findCellInSheet(sheetName, row, col) {
        if (!excelData || !excelData.sheets) return null;
        
        const sheet = excelData.sheets.find(s => s.name === sheetName);
        if (!sheet || !sheet.data) return null;
        
        for (const rowData of sheet.data) {
            for (const cell of rowData) {
                if (cell.row === row && cell.col === col) {
                    return cell;
                }
            }
        }
        return null;
    }

    function parseCellValue(value) {
        if (value === '' || value === null || value === undefined) {
            return null;
        }
        
        const trimmed = value.trim();
        
        if (trimmed.toLowerCase() === 'true') return true;
        if (trimmed.toLowerCase() === 'false') return false;
        
        if (trimmed.includes('%')) {
            const numValue = parseFloat(trimmed.replace('%', ''));
            if (!isNaN(numValue)) {
                return numValue / 100;
            }
        }
        
        const numValue = parseFloat(trimmed);
        if (!isNaN(numValue) && trimmed === String(numValue)) {
            return numValue;
        }
        
        return value;
    }

    async function addNewSheet() {
        const sheetName = prompt('请输入新工作表名称:');
        if (!sheetName || !sheetName.trim()) {
            return;
        }
        
        try {
            const response = await fetch(`/api/documents/${currentDocId}/excel/sheet`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    sheet_name: sheetName.trim()
                })
            });
            
            if (response.ok) {
                showToast(`工作表 "${sheetName}" 添加成功`, 'success');
                await loadExcelData();
                currentSheetIndex = excelData.sheets.length - 1;
                renderExcelContent();

                const error = await response.json();

                    sheet_name: currentSheet.name
                })
            });

                renderExcelContent();

                const error = await response.json();
                showToast(error.detail || '删除失败', 'error');

            showToast('网络错误', 'error');

    function renderPptContent() {
        const contentDiv = document.getElementById('document-content');
        
        if (!pptData || !pptData.success || !pptData.slides || pptData.slides.length === 0) {
            if (currentDocument.html_content) {
                contentDiv.innerHTML = currentDocument.html_content;
            } else if (currentDocument.content) {
                contentDiv.innerHTML = `<pre>${escapeHtml(currentDocument.content)}</pre>`;
            }
            return;
        }
        
        let html = '';
        
        if (pptData.slides.length > 1) {
            html += '<div class="sheet-tabs">';
            pptData.slides.forEach((slide, index) => {
                const activeClass = index === currentSlideIndex ? 'active' : '';
                const shapeCount = slide.shape_count || 0;
                html += `<button class="sheet-tab ${activeClass}" onclick="switchSlide(${index})">
                    幻灯片 ${slide.slide_idx}
                    <span class="sheet-row-count">${shapeCount}个形状</span>
                </button>`;
            });
            html += '</div>';
        }
        
        const currentSlide = pptData.slides[currentSlideIndex];
        
        if (currentSlide.is_paginated) {
            html += `<div class="pagination-info">
                <div class="pagination-stats">
                    <span class="stat-item"><strong>幻灯片:</strong> ${currentSlide.slide_idx} / ${pptData.slide_count}</span>
                    <span class="stat-item"><strong>状态:</strong> 分页加载中...</span>
                </div>
            </div>`;
        }
        
        html += renderSlideContent(currentSlide);
        
        if (isPptEditMode) {
            html += `
                <div class="excel-edit-actions">
                    <button class="btn btn-primary" onclick="showAddSlideModal()">➕ 添加幻灯片</button>
                    <button class="btn btn-danger" onclick="confirmDeletePptSlide()">🗑️ 删除当前幻灯片</button>
                    <button class="btn btn-secondary" onclick="showReorderSlideModal()">🔄 重排幻灯片</button>
                    <button class="btn btn-secondary" onclick="togglePptEditMode()">✓ 退出编辑模式</button>
                </div>
            `;
        }
        
        contentDiv.innerHTML = html;
        
        if (currentSlide.is_paginated && !currentSlide._loaded) {
            loadPaginatedSlideData(currentSlide.slide_idx).then(() => {
                if (pptData && pptData.slides[currentSlideIndex]) {
                    pptData.slides[currentSlideIndex]._loaded = true;
                    renderPptContent();
                }
            });
        }
    }

    function renderSlideContent(slide) {
        if (!slide || !slide.shapes || slide.shapes.length === 0) {
            return '<div class="empty-message">此幻灯片暂无内容</div>';
        }
        
        let html = '<div class="ppt-slide-container">';
        
        if (slide.text_content) {
            html += `<div class="slide-text-content" style="display: none;">${escapeHtml(slide.text_content)}</div>`;
        }
        
        html += '<div class="slide-shapes">';
        
        slide.shapes.forEach((shape, shapeIdx) => {
            html += renderShape(shape, shapeIdx, slide.slide_idx);
        });
        
        html += '</div>';
        
        if (slide.notes) {
            html += `<div class="slide-notes">
                <h4>备注</h4>
                <p>${escapeHtml(slide.notes)}</p>
            </div>`;
        }
        
        html += '</div>';
        
        return html;
    }

    function renderShape(shape, shapeIdx, slideIdx) {
        let html = '<div class="ppt-shape';
        
        if (isPptEditMode && shape.text && shape.text.trim()) {
            html += ' editable-shape';
        }
        
        html += '"';
        
        if (shape.left !== null && shape.top !== null) {
            html += ` style="position: relative; margin: 10px 0;"`;
        }
        
        html += '>';
        
        html += `<div class="shape-header">
            <span class="shape-type">${escapeHtml(shape.shape_type)}</span>
            <span class="shape-name">${escapeHtml(shape.name || 'Shape ' + (shapeIdx + 1))}</span>
        </div>`;
        
        if (shape.table) {
            html += renderShapeTable(shape.table);
        } else if (shape.text_frame && shape.text_frame.paragraphs && shape.text_frame.paragraphs.length > 0) {
            html += renderShapeTextFrame(shape, shapeIdx, slideIdx);
        } else if (shape.text) {
            if (isPptEditMode && shape.text.trim()) {
                html += `<div class="shape-text" 
                    contenteditable="true" 
                    data-slide-idx="${slideIdx}" 
                    data-shape-idx="${shapeIdx}"
                    onblur="handlePptShapeEdit(this)"
                    onkeydown="handlePptShapeKeydown(event, this)">
                    ${escapeHtml(shape.text)}
                </div>`;
            } else {
                html += `<div class="shape-text">${escapeHtml(shape.text)}</div>`;
            }
        } else {
            html += `<div class="shape-text shape-empty">(无文本内容)</div>`;
        }
        
        html += '</div>';
        
        return html;
    }

    function renderShapeTable(table) {
        if (!table || !table.cells || table.cells.length === 0) {
            return '<div class="shape-text shape-empty">(空表格)</div>';
        }
        
        let html = '<div class="ppt-table-container">';
        html += '<table class="ppt-table">';
        
        table.cells.forEach((row, rowIdx) => {
            html += '<tr>';
            row.forEach((cell, colIdx) => {
                html += `<td>${escapeHtml(cell.text || '')}</td>`;
            });
            html += '</tr>';
        });
        
        html += '</table>';
        html += '</div>';
        
        return html;
    }

    function renderShapeTextFrame(shape, shapeIdx, slideIdx) {
        let html = '<div class="shape-text-frame">';
        
        shape.text_frame.paragraphs.forEach((para, paraIdx) => {
            let level = para.level || 0;
            let indentStyle = `padding-left: ${level * 20}px;`;
            
            if (isPptEditMode && para.text) {
                html += `<p class="paragraph-text" 
                    style="${indentStyle}"
                    contenteditable="true" 
                    data-slide-idx="${slideIdx}" 
                    data-shape-idx="${shapeIdx}"
                    data-para-idx="${paraIdx}"
                    onblur="handlePptParagraphEdit(this)"
                    onkeydown="handlePptShapeKeydown(event, this)">
                    ${escapeHtml(para.text)}
                </p>`;
            } else {
                html += `<p class="paragraph-text" style="${indentStyle}">${escapeHtml(para.text || '')}</p>`;
            }
        });
        
        html += '</div>';
        
        return html;
    }

    async function switchSlide(index) {
        currentSlideIndex = index;
        
        const targetSlide = pptData.slides[index];
        
        if (targetSlide.is_paginated && !targetSlide._loaded) {
            await loadPaginatedSlideData(targetSlide.slide_idx);
            if (pptData && pptData.slides[currentSlideIndex]) {
                pptData.slides[currentSlideIndex]._loaded = true;
            }
        }
        
        renderPptContent();
    }

    function togglePptEditMode() {
        isPptEditMode = !isPptEditMode;
        const btn = document.getElementById('ppt-edit-btn');
        if (btn) {
            btn.innerHTML = isPptEditMode ? '✓ 退出PPT编辑' : '📽️ PPT编辑模式';
            btn.className = isPptEditMode ? 'btn btn-success' : 'btn btn-secondary';
        }
        renderPptContent();
        
        if (isPptEditMode) {
            showToast('已进入PPT编辑模式，点击文本内容即可编辑', 'info');
        }
    }

    async function handlePptShapeEdit(element) {
        const slideIdx = parseInt(element.dataset.slideIdx);
        const shapeIdx = parseInt(element.dataset.shapeIdx);
        const newValue = element.textContent;
        
        const slide = pptData.slides.find(s => s.slide_idx === slideIdx);
        if (slide && slide.shapes && slide.shapes[shapeIdx]) {
            const shape = slide.shapes[shapeIdx];
            if (shape.text === newValue) {
                return;
            }
        }
        
        try {
            const response = await fetch(`/api/documents/${currentDocId}/ppt/text`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    slide_idx: slideIdx,
                    shape_idx: shapeIdx,
                    text: newValue
                })
            });
            
            if (response.ok) {
                const result = await response.json();
                if (slide && slide.shapes && slide.shapes[shapeIdx]) {
                    slide.shapes[shapeIdx].text = newValue;
                }
                showToast('文本更新成功', 'success');
                
                if (result.document) {
                    if (result.document.html_content) {
                        currentDocument.html_content = result.document.html_content;
                    }
                    if (result.document.content) {
                        currentDocument.content = result.document.content;
                    }
                }
            } else {
                const error = await response.json();
                showToast(error.detail || '更新失败', 'error');
                if (slide && slide.shapes && slide.shapes[shapeIdx]) {
                    element.textContent = slide.shapes[shapeIdx].text || '';
                }
            }
        } catch (error) {
            showToast('网络错误', 'error');
            if (slide && slide.shapes && slide.shapes[shapeIdx]) {
                element.textContent = slide.shapes[shapeIdx].text || '';
            }
        }
    }

    async function handlePptParagraphEdit(element) {
        const slideIdx = parseInt(element.dataset.slideIdx);
        const shapeIdx = parseInt(element.dataset.shapeIdx);
        const paraIdx = parseInt(element.dataset.paraIdx);
        const newValue = element.textContent;
        
        const slide = pptData.slides.find(s => s.slide_idx === slideIdx);
        if (slide && slide.shapes && slide.shapes[shapeIdx]) {
            const shape = slide.shapes[shapeIdx];
            if (shape.text_frame && shape.text_frame.paragraphs && shape.text_frame.paragraphs[paraIdx]) {
                if (shape.text_frame.paragraphs[paraIdx].text === newValue) {
                    return;
                }
            }
        }
        
        await handlePptShapeEdit(element);
    }

    function handlePptShapeKeydown(event, element) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            element.blur();
        }
        if (event.key === 'Escape') {
            const slideIdx = parseInt(element.dataset.slideIdx);
            const shapeIdx = parseInt(element.dataset.shapeIdx);
            const paraIdx = element.dataset.paraIdx !== undefined ? parseInt(element.dataset.paraIdx) : null;
            
            const slide = pptData.slides.find(s => s.slide_idx === slideIdx);
            if (slide && slide.shapes && slide.shapes[shapeIdx]) {
                const shape = slide.shapes[shapeIdx];
                if (paraIdx !== null && shape.text_frame && shape.text_frame.paragraphs && shape.text_frame.paragraphs[paraIdx]) {
                    element.textContent = shape.text_frame.paragraphs[paraIdx].text || '';
                } else {
                    element.textContent = shape.text || '';
                }
            }
            element.blur();
        }
    }

            showToast('位置相同，无需移动', 'info');

                body: JSON.stringify({
                    old_idx: oldIdx,
                    new_idx: newIdx

            if (response.ok) {
                showToast(`幻灯片已从位置 ${oldIdx} 移动到 ${newIdx}`, 'success');

                await loadPptData();
                const newCurrentIndex = pptData.slides.findIndex(s => s.slide_idx === newIdx);

        }

        const modalHtml = `
            <div id="edit-modal-overlay" class="modal-overlay" onclick="closeEditModal(event)">
                <div class="modal modal-large" onclick="event.stopPropagation()">
                    <div class="modal-header">
                        <h3>编辑文档</h3>
                        <button class="modal-close" onclick="closeEditModal()">×</button>
                    </div>
                    <div class="modal-body">
                        <form id="edit-form">
                            <div class="form-group">
                                <label for="edit-title">文档标题</label>
                                <input type="text" id="edit-title" class="form-input" 
                                       value="${escapeHtml(currentDocument.title)}" placeholder="输入文档标题">
                            </div>
                            <div class="form-group">
                                <label for="edit-content">文档内容</label>
                                <textarea id="edit-content" class="form-textarea" 
                                          placeholder="输入文档内容...">${escapeHtml(currentDocument.content || '')}</textarea>
                            </div>
                            <div class="form-group">
                                <label for="edit-html-content">HTML内容 (可选)</label>
                                <textarea id="edit-html-content" class="form-textarea" 
                                          placeholder="输入HTML内容...">${escapeHtml(currentDocument.html_content || '')}</textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeEditModal()">取消</button>
                        <button type="button" class="btn btn-primary" onclick="submitEditForm()">保存</button>
                    </div>
                </div>
            </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function closeEditModal(event) {
        if (!event || event.target === event.currentTarget) {
            const overlay = document.getElementById('edit-modal-overlay');
            if (overlay) {
                overlay.remove();
            }
        }
    }

    async function submitEditForm() {
        const title = document.getElementById('edit-title').value.trim();
        const content = document.getElementById('edit-content').value;
        const htmlContent = document.getElementById('edit-html-content').value;
        
        if (!title) {
            showToast('请输入文档标题', 'error');
            return;
        }

        try {
            const response = await fetch(`/api/documents/${currentDocId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    title: title,
                    content: content,
                    html_content: htmlContent
                })
            });

            if (response.ok) {
                showToast('文档保存成功', 'success');
                closeEditModal();
                loadDocument();
            } else {
                const error = await response.json();
                showToast(error.detail || '保存失败', 'error');
            }
        } catch (error) {
            showToast('网络错误', 'error');
        }
    }

    async function reparseDocument() {
        if (!confirm('确定要重新解析此文档吗？这将使用最新的解析器重新提取文档内容。')) {
            return;
        }

        try {
            const reparseBtn = document.getElementById('reparse-btn');
            const originalText = reparseBtn.textContent;
            reparseBtn.textContent = '解析中...';
            reparseBtn.disabled = true;

            const response = await fetch(`/api/documents/${currentDocId}/reparse`, {
                method: 'POST'
            });

            if (response.ok) {
                showToast('文档重新解析成功', 'success');
                loadDocument();
            } else {
                const error = await response.json();
                showToast(error.detail || '重新解析失败', 'error');
            }

            reparseBtn.textContent = originalText;
            reparseBtn.disabled = false;
        } catch (error) {
            showToast('网络错误', 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadDocument();
    });
</script>
{% endblock %}
