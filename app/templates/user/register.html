{% extends "base.html" %}

{% block title %}注册 - 租房管理系统{% endblock %}

{% block content %}
<section class="py-8">
    <div class="container">
        <div style="max-width: 500px; margin: 0 auto;">
            <div class="card">
                <div class="card-header">
                    <h2 class="text-xl font-bold text-center">用户注册</h2>
                </div>
                <div class="card-body">
                    <form id="register-form">
                        <div class="form-group">
                            <label class="form-label" for="username">用户名 *</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名（3-20个字符）" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="email">邮箱 *</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="请输入邮箱地址" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="phone">手机号</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="请输入手机号">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="nickname">昵称</label>
                            <input type="text" class="form-control" id="nickname" name="nickname" placeholder="请输入昵称">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="password">密码 *</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码（至少6个字符）" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="confirm_password">确认密码 *</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="请再次输入密码" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="flex items-center gap-2">
                                <input type="checkbox" name="agree" required>
                                <span class="text-sm">我已阅读并同意<a href="#" class="text-primary">用户协议</a>和<a href="#" class="text-primary">隐私政策</a></span>
                            </label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-full">注册</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-secondary text-sm">
                            已有账号？<a href="/login" class="text-primary">立即登录</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
// 注册表单处理已在 main.js 中实现
</script>
{% endblock %}
