{% extends "base.html" %}

{% block title %}登录 - 租房管理系统{% endblock %}

{% block content %}
<section class="py-8">
    <div class="container">
        <div style="max-width: 400px; margin: 0 auto;">
            <div class="card">
                <div class="card-header">
                    <h2 class="text-xl font-bold text-center">用户登录</h2>
                </div>
                <div class="card-body">
                    <form id="login-form">
                        <div class="form-group">
                            <label class="form-label" for="username">用户名</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名或邮箱" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="password">密码</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="flex items-center gap-2">
                                <input type="checkbox" name="remember">
                                <span class="text-sm">记住我</span>
                            </label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-full">登录</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-secondary text-sm">
                            还没有账号？<a href="/register" class="text-primary">立即注册</a>
                        </p>
                    </div>
                </div>
            </div>
            
            <div class="card mt-4">
                <div class="card-body">
                    <h4 class="font-semibold mb-2">测试账号</h4>
                    <p class="text-sm text-secondary">管理员: admin / admin123</p>
                    <p class="text-sm text-secondary">普通用户: user1 / 123456</p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
// 登录表单处理已在 main.js 中实现
</script>
{% endblock %}
