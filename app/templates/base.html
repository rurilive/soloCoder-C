<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}文档管理平台{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-left">
                <h1><a href="/">📚 文档管理平台</a></h1>
            </div>
            <div class="header-right">
                <form class="search-form" action="/search" method="GET">
                    <input type="text" name="q" placeholder="搜索文档或文件夹..." value="{{ query|default('') }}">
                    <button type="submit">🔍 搜索</button>
                </form>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>📁 文件夹</h3>
                    <div id="folder-tree" class="folder-tree">
                        <div class="loading">加载中...</div>
                    </div>
                    <button class="btn btn-primary btn-small" onclick="showCreateFolderModal()">
                        ➕ 新建文件夹
                    </button>
                </div>
                
                <div class="sidebar-section">
                    <h3>📤 上传文档</h3>
                    <form id="upload-form" class="upload-form">
                        <input type="file" id="file-input" name="file" multiple 
                               accept=".md,.markdown,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
                        <label for="file-input" class="file-label">选择文件</label>
                        <div id="selected-files" class="selected-files"></div>
                        <button type="submit" class="btn btn-primary">上传</button>
                    </form>
                </div>
            </aside>

            <main class="content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modal-title">新建文件夹</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="modal-form">
                    <div class="form-group">
                        <label for="folder-name">文件夹名称</label>
                        <input type="text" id="folder-name" name="name" required placeholder="输入文件夹名称">
                    </div>
                    <input type="hidden" id="parent-folder-id" value="">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitModalForm()">确定</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let currentParentFolderId = null;

        async function loadFolderTree() {
            try {
                const response = await fetch('/api/folders/tree');
                const data = await response.json();
                const folderTree = document.getElementById('folder-tree');
                
                if (data.folders.length === 0) {
                    folderTree.innerHTML = '<div class="empty-message">暂无文件夹</div>';
                } else {
                    folderTree.innerHTML = renderFolderTree(data.folders);
                }
            } catch (error) {
                console.error('加载文件夹树失败:', error);
                document.getElementById('folder-tree').innerHTML = '<div class="error-message">加载失败</div>';
            }
        }

        function renderFolderTree(folders, level = 0) {
            let html = '';
            folders.forEach(folder => {
                const marginLeft = level * 20;
                html += `
                    <div class="folder-item" style="margin-left: ${marginLeft}px">
                        <div class="folder-header" onclick="toggleFolder(this, ${folder.id})">
                            <span class="folder-arrow">▶</span>
                            <span class="folder-name" onclick="event.stopPropagation(); goToFolder(${folder.id})">
                                📁 ${folder.name}
                            </span>
                            <span class="folder-count">(${folder.document_count})</span>
                            <div class="folder-actions">
                                <button class="action-btn" onclick="event.stopPropagation(); showCreateFolderModal(${folder.id})" title="新建子文件夹">➕</button>
                                <button class="action-btn" onclick="event.stopPropagation(); showEditFolderModal(${folder.id}, '${folder.name}')" title="重命名">✏️</button>
                                <button class="action-btn" onclick="event.stopPropagation(); deleteFolder(${folder.id})" title="删除">🗑️</button>
                            </div>
                        </div>
                        <div class="folder-children" style="display: none;">
                            ${folder.children.length > 0 ? renderFolderTree(folder.children, level + 1) : ''}
                        </div>
                    </div>
                `;
            });
            return html;
        }

        function toggleFolder(element, folderId) {
            const children = element.parentElement.querySelector('.folder-children');
            const arrow = element.querySelector('.folder-arrow');
            
            if (children.style.display === 'none') {
                children.style.display = 'block';
                arrow.textContent = '▼';
            } else {
                children.style.display = 'none';
                arrow.textContent = '▶';
            }
        }

        function goToFolder(folderId) {
            window.location.href = `/folder/${folderId}`;
        }

        function showCreateFolderModal(parentId = null) {
            currentParentFolderId = parentId;
            document.getElementById('modal-title').textContent = '新建文件夹';
            document.getElementById('folder-name').value = '';
            document.getElementById('parent-folder-id').value = parentId || '';
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('folder-name').focus();
        }

        function showEditFolderModal(folderId, folderName) {
            currentParentFolderId = folderId;
            document.getElementById('modal-title').textContent = '重命名文件夹';
            document.getElementById('folder-name').value = folderName;
            document.getElementById('parent-folder-id').value = 'edit-' + folderId;
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('folder-name').focus();
        }

        function closeModal(event) {
            if (!event || event.target === event.currentTarget) {
                document.getElementById('modal-overlay').style.display = 'none';
            }
        }

        async function submitModalForm() {
            const name = document.getElementById('folder-name').value.trim();
            const parentIdValue = document.getElementById('parent-folder-id').value;
            
            if (!name) {
                showToast('请输入文件夹名称', 'error');
                return;
            }

            try {
                let response;
                if (parentIdValue.startsWith('edit-')) {
                    const folderId = parentIdValue.replace('edit-', '');
                    const formData = new FormData();
                    formData.append('name', name);
                    response = await fetch(`/api/folders/${folderId}`, {
                        method: 'PUT',
                        body: formData
                    });
                } else {
                    const formData = new FormData();
                    formData.append('name', name);
                    if (parentIdValue) {
                        formData.append('parent_id', parentIdValue);
                    }
                    response = await fetch('/api/folders/', {
                        method: 'POST',
                        body: formData
                    });
                }

                if (response.ok) {
                    showToast('操作成功', 'success');
                    closeModal();
                    loadFolderTree();
                    if (window.location.pathname.startsWith('/folder/')) {
                        setTimeout(() => window.location.reload(), 500);
                    }
                } else {
                    const error = await response.json();
                    showToast(error.detail || '操作失败', 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
            }
        }

        async function deleteFolder(folderId) {
            if (!confirm('确定要删除此文件夹吗？子文件夹和文档也会被删除。')) {
                return;
            }

            try {
                const response = await fetch(`/api/folders/${folderId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showToast('文件夹删除成功', 'success');
                    loadFolderTree();
                    if (window.location.pathname === `/folder/${folderId}`) {
                        window.location.href = '/';
                    }
                } else {
                    const error = await response.json();
                    showToast(error.detail || '删除失败', 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast toast-${type}`;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        const fileInput = document.getElementById('file-input');
        const selectedFilesDiv = document.getElementById('selected-files');
        const uploadForm = document.getElementById('upload-form');

        fileInput.addEventListener('change', function() {
            const files = this.files;
            selectedFilesDiv.innerHTML = '';
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <span>${file.name}</span>
                    <span class="file-size">(${formatFileSize(file.size)})</span>
                `;
                selectedFilesDiv.appendChild(fileItem);
            }
        });

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const files = fileInput.files;
            if (files.length === 0) {
                showToast('请选择文件', 'error');
                return;
            }

            const formData = new FormData();
            
            for (let i = 0; i < files.length; i++) {
                formData.append('files', files[i]);
            }

            const currentFolderId = getCurrentFolderId();
            if (currentFolderId) {
                formData.append('folder_id', currentFolderId);
            }

            try {
                const response = await fetch('/api/upload/multiple', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showToast(result.message, 'success');
                    fileInput.value = '';
                    selectedFilesDiv.innerHTML = '';
                    
                    if (window.location.pathname === '/' || window.location.pathname.startsWith('/folder/')) {
                        setTimeout(() => window.location.reload(), 500);
                    }
                } else {
                    showToast(result.detail || '上传失败', 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
            }
        });

        function getCurrentFolderId() {
            const path = window.location.pathname;
            if (path.startsWith('/folder/')) {
                return path.split('/')[2];
            }
            return null;
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadFolderTree();
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
