{% extends "base.html" %}

{% block title %}歌单详情{% endblock %}

{% block content %}
<div class="loading" id="loading">
    <div class="spinner"></div>
    <p>加载中...</p>
</div>

<div id="playlistDetail" style="display: none;">
    <div style="display: flex; gap: 24px; margin-bottom: 32px; padding: 24px; background: linear-gradient(to bottom, var(--bg-card), transparent); border-radius: var(--border-radius);">
        <div id="playlistCover" style="width: 200px; height: 200px; background: var(--bg-card); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 80px; flex-shrink: 0;">
            📋
        </div>
        <div style="display: flex; flex-direction: column; justify-content: flex-end;">
            <div style="font-size: 12px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 8px;">歌单</div>
            <h1 id="playlistName" style="font-size: 48px; font-weight: bold; margin-bottom: 12px;"></h1>
            <div id="playlistInfo" style="color: var(--text-secondary); font-size: 14px; margin-bottom: 16px;"></div>
            <div style="display: flex; gap: 12px;">
                <button class="tab-btn active" onclick="playAllSongs()" style="font-size: 14px; padding: 12px 32px;">
                    ▶ 播放全部
                </button>
            </div>
        </div>
    </div>
    
    <h2 class="section-title">歌曲列表</h2>
    
    <div id="songsContainer">
        <div class="empty-state" id="emptySongs" style="display: none;">
            <div class="empty-state-icon">🎵</div>
            <div class="empty-state-title">歌单为空</div>
            <p>去搜索页面添加一些歌曲吧</p>
        </div>
        
        <div id="songsList"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const playlistId = {{ playlist_id }};
    let songsData = [];
    
    async function loadPlaylist() {
        const loading = document.getElementById('loading');
        const detail = document.getElementById('playlistDetail');
        
        loading.classList.add('show');
        detail.style.display = 'none';
        
        try {
            const [playlistResp, songsResp] = await Promise.all([
                fetch(`/api/playlists/${playlistId}`),
                fetch(`/api/playlists/${playlistId}/songs`)
            ]);
            
            if (!playlistResp.ok) {
                throw new Error('歌单不存在');
            }
            
            const playlist = await playlistResp.json();
            songsData = await songsResp.json();
            
            loading.classList.remove('show');
            detail.style.display = 'block';
            
            renderPlaylist(playlist);
            renderSongs(songsData);
            
        } catch (e) {
            loading.classList.remove('show');
            showToast('加载歌单失败', 'error');
            setTimeout(() => {
                window.location.href = '/playlists';
            }, 1500);
        }
    }
    
    function renderPlaylist(playlist) {
        document.getElementById('playlistName').textContent = playlist.name;
        document.getElementById('playlistInfo').textContent = `${playlist.song_count} 首歌曲`;
        
        const coverEl = document.getElementById('playlistCover');
        if (playlist.cover_url) {
            coverEl.innerHTML = `<img src="${playlist.cover_url}" alt="${playlist.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">`;
        }
    }
    
    function renderSongs(songs) {
        const emptyState = document.getElementById('emptySongs');
        const songsList = document.getElementById('songsList');
        
        if (songs.length === 0) {
            emptyState.style.display = 'block';
            songsList.style.display = 'none';
            return;
        }
        
        emptyState.style.display = 'none';
        songsList.style.display = 'block';
        
        songsList.innerHTML = songs.map((song, index) => `
            <div class="song-row" 
                 style="display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: 4px; cursor: pointer; transition: background 0.2s;"
                 onmouseenter="this.style.background='var(--bg-card)'"
                 onmouseleave="this.style.background='transparent'"
                 onclick="playSongFromList(${index})">
                <div style="width: 40px; text-align: center; color: var(--text-secondary); font-size: 14px;">
                    ${index + 1}
                </div>
                <div style="width: 48px; height: 48px; background: var(--bg-card); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;">
                    ${song.cover_url ? `<img src="${song.cover_url}" alt="" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;">` : '🎵'}
                </div>
                <div style="flex: 1; min-width: 0;">
                    <div style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        ${song.name}
                    </div>
                    <div style="font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        ${song.artist_name || '未知艺术家'}
                    </div>
                </div>
                <div style="color: var(--text-secondary); font-size: 13px; min-width: 50px; text-align: right;">
                    ${formatDuration(song.duration)}
                </div>
                <div style="display: flex; gap: 8px; opacity: 0; transition: opacity 0.2s;" 
                     class="song-actions"
                     onmouseenter="this.style.opacity='1'"
                     onclick="event.stopPropagation()">
                    <button style="background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px;" 
                            title="从歌单移除"
                            onclick="removeSongFromPlaylist(${song.id})">
                        🗑️
                    </button>
                </div>
            </div>
        `).join('');
        
        document.querySelectorAll('.song-row').forEach(row => {
            row.addEventListener('mouseenter', () => {
                const actions = row.querySelector('.song-actions');
                if (actions) actions.style.opacity = '1';
            });
            row.addEventListener('mouseleave', () => {
                const actions = row.querySelector('.song-actions');
                if (actions) actions.style.opacity = '0';
            });
        });
    }
    
    function formatDuration(seconds) {
        if (!seconds) return '--:--';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }
    
    function playSongFromList(index) {
        const song = songsData[index];
        if (!song) return;
        
        currentPlaylist = songsData.map(s => ({
            id: s.id,
            name: s.name,
            artist: s.artist_name,
            cover: s.cover_url
        }));
        currentIndex = index;
        
        playSong(song.id, song.name, song.artist_name, song.cover_url);
    }
    
    function playAllSongs() {
        if (songsData.length === 0) {
            showToast('歌单为空');
            return;
        }
        playSongFromList(0);
    }
    
    async function removeSongFromPlaylist(songId) {
        if (!confirm('确定要从歌单中移除这首歌吗？')) return;
        
        try {
            const response = await fetch(`/api/playlists/${playlistId}/songs/${songId}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                showToast('已从歌单移除');
                loadPlaylist();
            } else {
                showToast('移除失败');
            }
        } catch (e) {
            showToast('移除失败');
        }
    }
    
    loadPlaylist();
</script>
{% endblock %}
