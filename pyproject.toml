[project]
name = "document-platform"
version = "0.1.0"
description = "文档管理平台，支持上传解析Markdown、doc、excel、ppt文件，自动生成层级文档站"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "python-docx>=0.8.11",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.21",
    "markdown>=3.4.0",
    "aiofiles>=23.1.0",
    "olefile>=0.47",
    "pyantiword>=0.1.2",
    "chardet>=7.4.3",
    "mammoth>=1.12.0",
    "cmi-docx>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/parsers/doc_parser.py:1595-1752",
    "app/parsers/doc_parser.py:1779-1857",
    "app/parsers/doc_parser.py:812-914",
    "app/parsers/doc_parser.py:611",
    "app/parsers/doc_parser.py:666-799",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
