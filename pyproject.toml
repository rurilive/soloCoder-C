[project]
name = "photo-album"
version = "0.1.0"
description = "简易相册应用 - 支持图片上传、缩略图生成、标签和日期分组"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "pillow>=10.0.0",
    "sqlalchemy>=2.0.0",
    "aiofiles>=23.0.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"
