<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打码平台 - 验证码练习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #f8f9ff;
            border-radius: 10px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        .user-name {
            font-weight: 600;
            color: #333;
        }
        .admin-badge {
            background: #ffd700;
            color: #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #d0d0d0;
        }
        .btn-admin {
            background: #ffd700;
            color: #333;
        }
        .btn-admin:hover {
            background: #ffed4a;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #888;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }
        .auth-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #667eea;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .result-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        .result-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .result-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .type-selector {
            margin-bottom: 25px;
        }
        .type-selector label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
        }
        .type-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .type-btn {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .type-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .type-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        .captcha-section {
            text-align: center;
            margin-bottom: 25px;
        }
        .captcha-image-container {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }
        #captchaImage {
            max-width: 100%;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #captchaImage:hover {
            transform: scale(1.02);
        }
        .refresh-hint {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }
        .input-section {
            margin-bottom: 25px;
        }
        .input-section label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
        }
        #userInput {
            width: 100%;
            padding: 15px 20px;
            font-size: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-align: center;
            letter-spacing: 8px;
            outline: none;
            transition: border-color 0.3s;
            text-transform: uppercase;
        }
        #userInput:focus {
            border-color: #667eea;
        }
        .stats {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 打码平台</h1>
        <p class="subtitle">验证码识别练习 - 提升你的打码技能</p>

        <div id="authSection">
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">登录</div>
                <div class="auth-tab" data-tab="register">注册</div>
            </div>

            <div id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginUsername">用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码">
                </div>
                <button class="submit-btn" id="loginBtn">登录</button>
                <div id="loginMessage" class="result-message"></div>
            </div>

            <div id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regUsername">用户名 (3-20个字符)</label>
                    <input type="text" id="regUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="regPassword">密码 (至少6个字符)</label>
                    <input type="password" id="regPassword" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">确认密码</label>
                    <input type="password" id="regConfirmPassword" placeholder="请再次输入密码">
                </div>
                <button class="submit-btn" id="registerBtn">注册</button>
                <div id="registerMessage" class="result-message"></div>
            </div>

            <div style="margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 10px; font-size: 13px; color: #856404;">
                <strong>💡 提示：</strong><br>
                管理员账户：用户名 <strong>admin</strong>，密码 <strong>admin123</strong>
            </div>
        </div>

        <div id="mainApp" class="hidden">
            <div class="user-bar">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span class="user-name" id="displayUsername"></span>
                    <span class="admin-badge hidden" id="adminBadge">管理员</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-admin hidden" id="adminBtn" onclick="goToAdmin()">管理后台</button>
                    <button class="btn btn-secondary" id="logoutBtn" onclick="logout()">退出登录</button>
                </div>
            </div>

            <div class="type-selector">
                <label>选择验证码类型：</label>
                <div class="type-buttons">
                    <button class="type-btn active" data-type="mixed">混合验证码</button>
                    <button class="type-btn" data-type="digits">数字验证码</button>
                    <button class="type-btn" data-type="letters">字母验证码</button>
                    <button class="type-btn" data-type="math">数学运算</button>
                </div>
            </div>

            <div class="captcha-section">
                <div class="captcha-image-container">
                    <img id="captchaImage" alt="验证码" title="点击刷新">
                </div>
                <p class="refresh-hint">💡 点击图片刷新验证码</p>
            </div>

            <div class="input-section">
                <label for="userInput">输入验证码：</label>
                <input type="text" id="userInput" placeholder="请输入验证码..." autocomplete="off">
            </div>

            <button class="submit-btn" id="submitBtn">提交验证</button>

            <div id="resultMessage" class="result-message"></div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">总次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">正确</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="accuracy">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentCaptchaId = null;
        let selectedType = 'mixed';
        let token = localStorage.getItem('token');
        let currentUser = null;

        const authSection = document.getElementById('authSection');
        const mainApp = document.getElementById('mainApp');
        const authTabs = document.querySelectorAll('.auth-tab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginMessage = document.getElementById('loginMessage');

        const regUsername = document.getElementById('regUsername');
        const regPassword = document.getElementById('regPassword');
        const regConfirmPassword = document.getElementById('regConfirmPassword');
        const registerBtn = document.getElementById('registerBtn');
        const registerMessage = document.getElementById('registerMessage');

        const captchaImage = document.getElementById('captchaImage');
        const userInput = document.getElementById('userInput');
        const submitBtn = document.getElementById('submitBtn');
        const resultMessage = document.getElementById('resultMessage');
        const typeButtons = document.querySelectorAll('.type-btn');

        function showMessage(element, success, message) {
            element.textContent = message;
            element.className = `result-message ${success ? 'success' : 'error'}`;
        }

        function hideMessage(element) {
            element.className = 'result-message';
        }

        function hexToBase64(hexString) {
            const bytes = new Uint8Array(hexString.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            return btoa(String.fromCharCode(...bytes));
        }

        authTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                authTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                const tabName = tab.dataset.tab;
                loginForm.classList.toggle('active', tabName === 'login');
                registerForm.classList.toggle('active', tabName === 'register');
                hideMessage(loginMessage);
                hideMessage(registerMessage);
            });
        });

        async function login() {
            const username = loginUsername.value.trim();
            const password = loginPassword.value;

            if (!username || !password) {
                showMessage(loginMessage, false, '请填写用户名和密码');
                return;
            }

            loginBtn.disabled = true;
            hideMessage(loginMessage);

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('/api/login', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    token = data.access_token;
                    localStorage.setItem('token', token);
                    showMessage(loginMessage, true, '登录成功！');
                    setTimeout(checkAuth, 500);
                } else {
                    const error = await response.json();
                    showMessage(loginMessage, false, error.detail || '登录失败');
                }
            } catch (error) {
                showMessage(loginMessage, false, '网络错误，请重试');
            } finally {
                loginBtn.disabled = false;
            }
        }

        async function register() {
            const username = regUsername.value.trim();
            const password = regPassword.value;
            const confirmPassword = regConfirmPassword.value;

            if (!username || !password || !confirmPassword) {
                showMessage(registerMessage, false, '请填写所有字段');
                return;
            }

            if (password !== confirmPassword) {
                showMessage(registerMessage, false, '两次密码输入不一致');
                return;
            }

            registerBtn.disabled = true;
            hideMessage(registerMessage);

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    showMessage(registerMessage, true, '注册成功！请登录');
                    setTimeout(() => {
                        authTabs[0].click();
                        loginUsername.value = username;
                    }, 1000);
                } else {
                    const error = await response.json();
                    showMessage(registerMessage, false, error.detail || '注册失败');
                }
            } catch (error) {
                showMessage(registerMessage, false, '网络错误，请重试');
            } finally {
                registerBtn.disabled = false;
            }
        }

        async function checkAuth() {
            if (!token) {
                authSection.classList.remove('hidden');
                mainApp.classList.add('hidden');
                return;
            }

            try {
                const response = await fetch('/api/user/info', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    
                    document.getElementById('displayUsername').textContent = currentUser.username;
                    document.getElementById('userAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
                    
                    if (currentUser.is_admin) {
                        document.getElementById('adminBadge').classList.remove('hidden');
                        document.getElementById('adminBtn').classList.remove('hidden');
                    } else {
                        document.getElementById('adminBadge').classList.add('hidden');
                        document.getElementById('adminBtn').classList.add('hidden');
                    }

                    authSection.classList.add('hidden');
                    mainApp.classList.remove('hidden');
                    
                    await loadUserStats();
                    await loadCaptcha();
                } else {
                    token = null;
                    localStorage.removeItem('token');
                    authSection.classList.remove('hidden');
                    mainApp.classList.add('hidden');
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
                authSection.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        }

        function logout() {
            token = null;
            currentUser = null;
            localStorage.removeItem('token');
            authSection.classList.remove('hidden');
            mainApp.classList.add('hidden');
            loginPassword.value = '';
        }

        function goToAdmin() {
            window.location.href = '/admin';
        }

        async function loadCaptcha() {
            if (!token) return;
            
            try {
                captchaImage.classList.add('loading');
                const response = await fetch(`/api/captcha?type=${selectedType}&length=4`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    currentCaptchaId = data.captcha_id;
                    captchaImage.src = `data:image/png;base64,${hexToBase64(data.image)}`;
                    userInput.value = '';
                    userInput.focus();
                    hideMessage(resultMessage);
                } else if (response.status === 401) {
                    logout();
                }
            } catch (error) {
                console.error('加载验证码失败:', error);
            } finally {
                captchaImage.classList.remove('loading');
            }
        }

        async function loadUserStats() {
            if (!token) return;

            try {
                const response = await fetch('/api/user/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('totalCount').textContent = data.stats.total;
                    document.getElementById('correctCount').textContent = data.stats.correct;
                    document.getElementById('accuracy').textContent = `${data.stats.accuracy}%`;
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }

        async function submitCaptcha() {
            const inputValue = userInput.value.trim();
            if (!inputValue || !token) {
                userInput.focus();
                return;
            }

            try {
                submitBtn.disabled = true;
                const formData = new FormData();
                formData.append('captcha_id', currentCaptchaId);
                formData.append('user_input', inputValue);

                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const data = await response.json();

                if (data.success) {
                    showMessage(resultMessage, true, data.message);
                    setTimeout(loadCaptcha, 1500);
                } else {
                    showMessage(resultMessage, false, data.message);
                }
                
                await loadUserStats();
            } catch (error) {
                console.error('验证失败:', error);
                showMessage(resultMessage, false, '验证出错，请重试');
            } finally {
                submitBtn.disabled = false;
            }
        }

        loginBtn.addEventListener('click', login);
        loginPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });

        registerBtn.addEventListener('click', register);
        regConfirmPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') register();
        });

        typeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                typeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedType = btn.dataset.type;
                loadCaptcha();
            });
        });

        captchaImage.addEventListener('click', loadCaptcha);
        submitBtn.addEventListener('click', submitCaptcha);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitCaptcha();
        });

        checkAuth();
    </script>
</body>
</html>
