<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户创建成功 - 简易相册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .success-container {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        
        .success-icon svg {
            width: 40px;
            height: 40px;
            color: white;
        }
        
        .success-container h1 {
            color: #667eea;
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }
        
        .success-container p {
            color: #666;
            margin-bottom: 1.5rem;
        }
        
        .token-box {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
        }
        
        .token-box label {
            display: block;
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .token-box .token-value {
            font-family: 'Courier New', monospace;
            font-size: 1.25rem;
            color: #667eea;
            background: white;
            padding: 0.75rem;
            border-radius: 8px;
            word-break: break-all;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .warning-box {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            color: #92400e;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        
        .warning-box strong {
            color: #78350f;
        }
        
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0ff;
            color: #667eea;
            margin-left: 0.75rem;
        }
        
        .btn-secondary:hover {
            background: #e0e0ff;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
        
        <h1>🎉 账户创建成功！</h1>
        <p>欢迎，{{ username }}！以下是您的访问凭证</p>
        
        <div class="warning-box">
            <strong>⚠️ 重要提醒：</strong><br>
            请立即复制并保存好您的访问 token。<br>
            <strong>此 token 是您登录的唯一凭证</strong>，如果丢失将无法找回您的相册数据。
        </div>
        
        <div class="token-box">
            <label>您的访问 Token</label>
            <div class="token-value">{{ token }}</div>
        </div>
        
        <div>
            <a href="/login" class="btn btn-primary">使用此 Token 登录</a>
            <a href="/" class="btn btn-secondary">返回首页</a>
        </div>
    </div>
</body>
</html>
